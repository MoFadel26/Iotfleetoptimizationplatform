# Railway config for the backend (Flask) service.
# The frontend service in this repo overrides build/start commands via the
# Railway dashboard (see DEPLOY.md) so this file applies only to the backend.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "gunicorn run:app --bind 0.0.0.0:$PORT --workers 2"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
